<svg width="800" height="40" viewBox="0 0 800 40" xmlns="http://www.w3.org/2000/svg">
    <style>
        .scene {
            animation: move-scene 6s linear infinite;
        }
        @keyframes move-scene {
            /* Moving from Right to Left */
            0% { transform: translateX(850px); }
            100% { transform: translateX(-150px); }
        }
    </style>
    
    <!-- Cyberpunk Theme Dots -->
    <circle cx="100" cy="20" r="4" fill="#00FFCC" />
    <circle cx="200" cy="20" r="4" fill="#FF0055" />
    <circle cx="300" cy="20" r="4" fill="#00FFCC" />
    <circle cx="400" cy="20" r="4" fill="#FF0055" />
    <circle cx="500" cy="20" r="4" fill="#00FFCC" />
    <circle cx="600" cy="20" r="4" fill="#FF0055" />
    <circle cx="700" cy="20" r="4" fill="#00FFCC" />
    
    <!-- Moving Scene (Pacman + Ghost) -->
    <g class="scene">
        <!-- Ghost (Pink #FF0055) running away in front (on the left) -->
        <g transform="translate(0, 0)">
            <path d="M -40,20 q 0,-20 15,-20 t 15,20 l 0,10 l -5,-5 l -5,5 l -5,-5 l -5,5 l -5,-5 l -5,5 z" fill="#FF0055" />
            <!-- Eyes looking left -->
            <circle cx="-32" cy="12" r="4" fill="white" />
            <circle cx="-18" cy="12" r="4" fill="white" />
            <circle cx="-34" cy="12" r="2" fill="#00FFCC" />
            <circle cx="-20" cy="12" r="2" fill="#00FFCC" />
        </g>

        <!-- Pacman (Yellow) Facing Left, chasing from behind -->
        <g transform="translate(80, 0)">
            <!-- We use SVG animate to simulate the mouth opening and closing -->
            <path fill="#FFD700">
                <animate attributeName="d" 
                    values="M 0,20 l -15,-15 a 20,20 0 1,1 0,30 z;
                            M 0,20 l -15,-3 a 20,20 0 1,1 0,6 z;
                            M 0,20 l -15,-15 a 20,20 0 1,1 0,30 z" 
                    dur="0.4s" repeatCount="indefinite" />
            </path>
        </g>
    </g>
</svg>
