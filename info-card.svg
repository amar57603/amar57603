<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280">
  <defs>
    <style>
      .line {
        opacity: 0;
        animation: fadeIn 0.5s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .l0 { animation-delay: 0.0s; }
      .l1 { animation-delay: 0.15s; }
      .l2 { animation-delay: 0.30s; }
      .l3 { animation-delay: 0.45s; }
      .l4 { animation-delay: 0.60s; }
      .l5 { animation-delay: 0.75s; }
      .l6 { animation-delay: 0.90s; }
      .l7 { animation-delay: 1.05s; }
    </style>
  </defs>

  <rect width="490" height="280" rx="8" fill="#0b0c10" stroke="#FF0055" stroke-width="1"/>

  <text x="20" y="40" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="bold" fill="#00FFCC" class="line l0">amar57603@github</text>
  <text x="20" y="60" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l1">─────────────────────</text>

  <text x="20" y="90" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l2">Role     <tspan fill="#FFFFFF">Final-year CS &amp; AI @ UTeM</tspan></text>
  <text x="20" y="120" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l3">Focus    <tspan fill="#FFFFFF">Machine Learning, Data Science</tspan></text>
  <text x="20" y="150" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l4">Stack    <tspan fill="#FFFFFF">Python · PyTorch · TensorFlow</tspan></text>
  <text x="20" y="180" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l5">Cloud    <tspan fill="#FFFFFF">GCP · Cloudflare · Supabase</tspan></text>
  <text x="20" y="210" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l6">Tools    <tspan fill="#FFFFFF">Arduino · Raspberry Pi · Linux</tspan></text>
  <text x="20" y="240" font-family="Consolas, Monaco, monospace" font-size="14" fill="#FF0055" class="line l7">Editor   <tspan fill="#FFFFFF">VS Code</tspan></text>
</svg>
